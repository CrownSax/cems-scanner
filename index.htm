<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CEMS Continuous QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #111827;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 560px;
      margin: auto;
    }

    .header {
      background: #1f2937;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 13px;
      color: #d1d5db;
      line-height: 1.5;
    }

    .card {
      background: #fff;
      color: #111827;
      border-radius: 14px;
      padding: 18px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      min-height: 280px;
    }

    .controls {
      margin-top: 15px;
    }

    select,
    button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      font-size: 15px;
    }

    select {
      border: 1px solid #d1d5db;
      background: #fff;
      margin-bottom: 10px;
    }

    button {
      border: none;
      background: #111827;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    .status {
      margin-top: 14px;
      padding: 13px;
      border-radius: 9px;
      background: #f3f4f6;
      color: #374151;
      line-height: 1.5;
      font-size: 14px;
    }

    .success {
      background: #ecfdf5;
      color: #166534;
    }

    .error {
      background: #fef2f2;
      color: #991b1b;
    }

    .warning {
      background: #fff7ed;
      color: #9a3412;
    }

    .info {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .attendee {
      margin-top: 12px;
      padding: 15px;
      border-radius: 9px;
      background: #f9fafb;
      line-height: 1.7;
      font-size: 14px;
    }

    .attendee strong {
      display: inline-block;
      min-width: 120px;
    }

    .footer {
      margin-top: 15px;
      text-align: center;
      color: #9ca3af;
      font-size: 11px;
    }

  </style>

</head>


<body>


<div class="container">


  <div class="header">

    <h1>
      CEMS CONTINUOUS QR SCANNER
    </h1>

    <p>
      CROWNSAX LIVE IN CONCERT · BREATH OF WORSHIP
      <br>
      18 SEPTEMBER 2026 · DAVID EVENT CENTER, ASABA
    </p>

  </div>


  <div class="card">


    <div id="reader"></div>


    <div class="controls">

      <select id="cameraSelect">

        <option value="">
          Detecting cameras...
        </option>

      </select>


      <button
        id="startButton"
        onclick="startScanner()"
      >

        START CAMERA

      </button>

    </div>


    <div
      id="status"
      class="status info"
    >

      Initializing scanner...

    </div>


    <div
      id="attendee"
      class="attendee"
      style="display:none;"
    ></div>


  </div>


  <div class="footer">

    CEMS v3.4 · Continuous Event Check-In System

  </div>


</div>


<script>


/* =============================================================
   CONFIGURATION
============================================================= */


const API_URL =
  "https://script.google.com/macros/s/AKfycbyR9dDCTcV-qSSAh8zG0NvKzvdM-f6X64_S3yFCEQu8FiuU9L4U6DBVg7d-bAn3DjF69w/exec";


const CHECK_IN_PAGE =
  "https://script.google.com/macros/s/AKfycbyR9dDCTcV-qSSAh8zG0NvKzvdM-f6X64_S3yFCEQu8FiuU9L4U6DBVg7d-bAn3DjF69w/exec?page=checkin";


let scanner = null;

let scannerRunning = false;

let cameras = [];

let processingScan = false;

let lastScan = "";

let lastScanTime = 0;


/* =============================================================
   GET USHER
============================================================= */


const params =
  new URLSearchParams(
    window.location.search
  );


const usher =
  (
    params.get("usher") ||
    "USHER"
  ).trim();


/* =============================================================
   STATUS
============================================================= */


function setStatus(
  message,
  type
) {

  const box =
    document.getElementById(
      "status"
    );


  box.className =
    "status " +
    (
      type ||
      "info"
    );


  box.innerText =
    message;

}


/* =============================================================
   LOAD CAMERAS
============================================================= */


async function loadCameras() {

  setStatus(
    "Requesting camera permission...",
    "info"
  );


  try {

    /*
     * IMPORTANT:
     *
     * We deliberately DO NOT use:
     *
     * facingMode: "environment"
     *
     * because that caused the browser error:
     *
     * "'facingMode' should be string or object with exact as key"
     *
     * Instead, html5-qrcode enumerates the available
     * cameras after permission is granted.
     */


    cameras =
      await Html5Qrcode
        .getCameras();


    const select =
      document.getElementById(
        "cameraSelect"
      );


    select.innerHTML = "";


    if (
      !cameras ||
      cameras.length === 0
    ) {

      setStatus(
        "No camera was detected on this device.",
        "error"
      );

      return;

    }


    cameras.forEach(
      function(camera, index) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          camera.id;


        option.textContent =
          camera.label ||
          (
            "Camera " +
            (index + 1)
          );


        select.appendChild(
          option
        );

      }
    );


    /*
     * Prefer the rear/environment camera
     * when the browser exposes useful labels.
     */


    let preferredCamera =
      cameras.find(
        function(camera) {

          const label =
            String(
              camera.label || ""
            )
              .toLowerCase();


          return (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment") ||
            label.includes("world")
          );

        }
      );


    if (
      preferredCamera
    ) {

      select.value =
        preferredCamera.id;

    }


    setStatus(
      "Camera detected. Select a camera and tap START CAMERA.",
      "success"
    );

  }

  catch (error) {

    console.error(
      "Camera enumeration error:",
      error
    );


    setStatus(

      "Unable to access the camera. " +
      "Please allow camera permission in your browser and reload the page.",

      "error"

    );

  }

}


/* =============================================================
   START SCANNER
============================================================= */


async function startScanner() {

  const select =
    document.getElementById(
      "cameraSelect"
    );


  const button =
    document.getElementById(
      "startButton"
    );


  const cameraId =
    select.value;


  if (!cameraId) {

    setStatus(
      "Please select a camera first.",
      "warning"
    );

    return;

  }


  if (
    scannerRunning
  ) {

    return;

  }


  button.disabled =
    true;


  button.innerText =
    "STARTING CAMERA...";


  setStatus(
    "Starting camera...",
    "info"
  );


  try {

    scanner =
      new Html5Qrcode(
        "reader"
      );


    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const minDimension =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            );


          const size =
            Math.floor(
              minDimension * 0.72
            );


          return {

            width:
              size,

            height:
              size

          };

        },

        aspectRatio:
          1.7777778,

        disableFlip:
          false

      },

      onScanSuccess,

      onScanFailure

    );


    scannerRunning =
      true;


    button.innerText =
      "CAMERA RUNNING";


    setStatus(
      "Scanner active. Point the camera at an attendee QR code.",
      "success"
    );

  }

  catch (error) {

    console.error(
      "Scanner start error:",
      error
    );


    scannerRunning =
      false;


    button.disabled =
      false;


    button.innerText =
      "START CAMERA";


    setStatus(

      "CAMERA ERROR: " +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      ),

      "error"

    );

  }

}


/* =============================================================
   QR SUCCESS
============================================================= */


async function onScanSuccess(
  decodedText
) {

  const now =
    Date.now();


  /*
   * Prevent the same QR from being processed
   * repeatedly while it remains in camera view.
   */


  if (

    processingScan ||

    (
      decodedText === lastScan &&
      (
        now -
        lastScanTime
      ) <
      4000
    )

  ) {

    return;

  }


  lastScan =
    decodedText;


  lastScanTime =
    now;


  processingScan =
    true;


  setStatus(
    "QR detected. Verifying attendee...",
    "info"
  );


  try {

    const result =
      await processCheckIn(
        decodedText
      );


    if (
      result &&
      result.success === true
    ) {

      showAttendee(
        result.attendee || {},
        true
      );


      setStatus(
        "CHECK-IN SUCCESSFUL. Ready for next attendee.",
        "success"
      );


      /*
       * Short pause before accepting the next QR.
       */


      setTimeout(
        function() {

          processingScan =
            false;

          setStatus(
            "Scanner active. Ready for next attendee.",
            "success"
          );

        },
        1200
      );


      return;

    }


    /*
     * Already checked in
     */


    if (
      result &&
      result.code ===
      "ALREADY_CHECKED_IN"
    ) {

      showAttendee(
        result.attendee || {},
        false
      );


      setStatus(
        "ATTENDEE ALREADY CHECKED IN.",
        "warning"
      );


      setTimeout(
        function() {

          processingScan =
            false;

        },
        1500
      );


      return;

    }


    /*
     * Cancelled
     */


    if (
      result &&
      result.code ===
      "CANCELLED"
    ) {

      showAttendee(
        result.attendee || {},
        false
      );


      setStatus(
        "THIS REGISTRATION IS CANCELLED.",
        "error"
      );


      setTimeout(
        function() {

          processingScan =
            false;

        },
        1500
      );


      return;

    }


    /*
     * Not found
     */


    setStatus(

      (
        result &&
        result.message
      )

        ? result.message

        : "ATTENDEE NOT FOUND.",

      "error"

    );


    setTimeout(
      function() {

        processingScan =
          false;

      },
      1500
    );

  }

  catch (error) {

    console.error(
      "Check-in API error:",
      error
    );


    setStatus(

      "CHECK-IN ERROR: " +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      ),

      "error"

    );


    setTimeout(
      function() {

        processingScan =
          false;

      },
      1500
    );

  }

}


/* =============================================================
   QR FAILURE CALLBACK
============================================================= */


function onScanFailure(
  errorMessage
) {

  /*
   * This callback fires constantly while
   * the scanner is looking for a QR.
   *
   * Do not display every failure to the user.
   */

}


/* =============================================================
   SEND CHECK-IN TO CEMS
============================================================= */


async function processCheckIn(
  qrPayload
) {

  /*
   * IMPORTANT:
   *
   * Google Apps Script Web Apps do not reliably support
   * cross-origin fetch requests in the same way as a normal
   * REST API.
   *
   * This endpoint is therefore expected to be the deployed
   * CEMS Web App /exec URL.
   */


  const response =
    await fetch(
      API_URL,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify({

            action:
              "CHECK_IN",

            payload:
              qrPayload,

            checkedInBy:
              usher

          })

      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "CEMS server returned HTTP " +
      response.status
    );

  }


  return await response.json();

}


/* =============================================================
   DISPLAY ATTENDEE
============================================================= */


function showAttendee(
  attendee,
  success
) {

  const box =
    document.getElementById(
      "attendee"
    );


  box.innerHTML =

    "<strong>NAME:</strong> " +
    escapeHtml(
      attendee.fullName ||
      ""
    ) +

    "<br>" +

    "<strong>REG ID:</strong> " +
    escapeHtml(
      attendee.registrationId ||
      ""
    ) +

    "<br>" +

    "<strong>PHONE:</strong> " +
    escapeHtml(
      attendee.phone ||
      ""
    ) +

    "<br>" +

    "<strong>SEAT:</strong> " +
    escapeHtml(
      attendee.seat ||
      "GENERAL ADMISSION"
    ) +

    "<br>" +

    "<strong>TYPE:</strong> " +
    escapeHtml(
      attendee.attendanceType ||
      "GENERAL ADMISSION"
    ) +

    "<br>" +

    "<strong>CHECKED IN BY:</strong> " +
    escapeHtml(
      attendee.checkedInBy ||
      usher
    ) +

    "<br>" +

    "<strong>CHECK-IN TIME:</strong> " +
    escapeHtml(
      attendee.checkInTime ||
      ""
    );


  box.style.display =
    "block";

}


/* =============================================================
   HTML ESCAPE
============================================================= */


function escapeHtml(
  value
) {

  return String(

    value === undefined ||
    value === null
      ? ""
      : value

  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =============================================================
   INITIALIZE
============================================================= */


window.addEventListener(
  "load",
  function() {

    setStatus(
      "Scanner loaded. Requesting camera access...",
      "info"
    );


    loadCameras();

  }
);


</script>

</body>

</html>
